# imjini 공통 응답 설정 (보안 헤더 + 압축)
# imjini.com server 블록과 /imjini/ 하위경로 location 에서 include 한다.

# 오류 화면에 nginx 버전 숨김
server_tokens off;

# CSS, JS, SVG 압축 전송 (HTML 은 서버 전체 설정에서 이미 압축)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml text/plain;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 우리 서버의 파일만 실행. sha256 은 header.php 의 인라인 스크립트 한 줄 (스크립트를 바꾸면 해시도 다시 계산)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-T/tcfgtFIqewdICXkiIzOILjIIwMyJ0SBMBN53P07Pc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
