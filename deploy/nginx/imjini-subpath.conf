# imjini - 예전 개발용 주소 kir1.cafe24.com/imjini/ → https://www.imjini.com (경로·쿼리 그대로, 301 영구 이동)
# lambda 443 server 블록에서 include 한다. 예전에 공유한 링크로 들어와도 같은 페이지로 간다.
#   /imjini                    → https://www.imjini.com/
#   /imjini/projects/linkr     → https://www.imjini.com/projects/linkr

location = /imjini {
    return 301 https://www.imjini.com/;
}

# ^~ : lambda의 정규식 location(.php, 숨김파일)보다 우선 적용
location ^~ /imjini/ {
    rewrite ^/imjini/(.*)$ https://www.imjini.com/$1 permanent;
}
