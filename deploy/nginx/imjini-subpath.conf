# imjini - kir1.cafe24.com/imjini/ 하위경로 (도메인 연결 전 확인용)
# lambda 443 server 블록에서 include 한다. 도메인 연결 후에는 imjini.com 으로 301 이동시킨다.

location = /imjini {
    return 301 /imjini/;
}

# ^~ : lambda의 정규식 location(.php, 숨김파일)보다 우선 적용
location ^~ /imjini/ {
    alias /var/www/imjini/public/;
    index index.php;

    include snippets/imjini-headers.conf;

    # 정적 파일(css, js, 글꼴, 이미지) 7일 캐시. 파일을 바꾸면 주소 뒤 ?v= 번호가 바뀌어 새로 받는다
    expires 7d;

    error_page 404 /imjini/404.php;

    # 글꼴은 바뀌지 않는 파일이라 1년 캐시
    location ^~ /imjini/assets/fonts/ {
        expires 1y;
    }

    location ~ /\. { deny all; }

    # 입구는 index.php 하나
    location = /imjini/index.php {
        expires off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/imjini/public/index.php;
        fastcgi_param BASE_PATH /imjini;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 404 화면 (주소로 직접은 못 열고, 오류가 났을 때만)
    location = /imjini/404.php {
        internal;
        expires off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/imjini/public/404.php;
        fastcgi_param BASE_PATH /imjini;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 프로젝트 상세: /imjini/projects/linkr → project.php (주소의 linkr 를 PROJECT_SLUG 로 넘김)
    location ~ ^/imjini/projects/([a-z0-9-]+)$ {
        expires off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/imjini/public/project.php;
        fastcgi_param BASE_PATH /imjini;
        fastcgi_param PROJECT_SLUG $1;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 끝에 / 가 붙으면 없는 주소로
    location ~ ^/imjini/projects/([a-z0-9-]+)/$ {
        return 301 /imjini/projects/$1;
    }

    # 목록 주소는 메인의 Projects 로
    location ~ ^/imjini/projects/?$ {
        return 301 /imjini/#projects;
    }

    # 그 외 PHP 파일은 실행하지 않음
    location ~ \.php$ { return 404; }
}
